name: Release CI

on:
  push:
    branches:
      - master
    paths:
      - .release-version
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            arch: x64
            output: 'Bin/x64/Release (lite)'
          - platform: x86
            arch: x86
            output: 'Bin/Release (lite)'
          - platform: ARM64EC
            arch: ARM64EC
            output: 'Bin/ARM64EC/Release (lite)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: cmd
        run: msbuild TrafficMonitor_Lite.sln -m -p:configuration="Release (lite)" -p:platform=${{ matrix.platform }} -p:platformToolset=v143

      - name: Package
        shell: powershell
        run: |
          $version = (Get-Content .release-version -Raw).Trim()
          $output = '${{ matrix.output }}'
          $stage = "package-${{ matrix.arch }}"
          $zip = "TrafficMonitor_${version}_${{ matrix.arch }}_Lite.zip"

          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item "$output/TrafficMonitor.exe" $stage
          Get-ChildItem $output -Filter *.dll -ErrorAction SilentlyContinue | Copy-Item -Destination $stage
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.arch }}
          path: TrafficMonitor_*_${{ matrix.arch }}_Lite.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < .release-version)"
          gh release create "$VERSION" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "TrafficMonitor Rev $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest
