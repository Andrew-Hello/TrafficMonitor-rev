name: Feature - Taskbar Volume Wheel

on:
  push:
    branches:
      - feature/taskbar-volume-wheel
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            artifact: TrafficMonitor-volume-wheel-x64
            output: 'Bin/x64/Release (lite)'
          - platform: x86
            artifact: TrafficMonitor-volume-wheel-x86
            output: 'Bin/Release (lite)'
          - platform: ARM64EC
            artifact: TrafficMonitor-volume-wheel-ARM64EC
            output: 'Bin/ARM64EC/Release (lite)'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build
        shell: cmd
        run: msbuild TrafficMonitor_Lite.sln -m -p:configuration="Release (lite)" -p:platform=${{ matrix.platform }} -p:platformToolset=v143

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}/TrafficMonitor.exe
            ${{ matrix.output }}/*.dll
          if-no-files-found: error
